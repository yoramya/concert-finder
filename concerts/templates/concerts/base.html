<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Concert Finder{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #121212; color: #eee; }
        .navbar, .card { background-color: #181818 !important; }
        a { color: #1db954; }
        .card { border: 1px solid #282828; }
        .card-title { color: #f5f5f5 !important; font-weight: 600; }
        .btn-spotify { background-color: #1db954; border-color: #1db954; color: #000; font-weight: 600; }
        .btn-spotify:hover { background-color: #1ed760; border-color: #1ed760; color: #000; }
        .text-muted-light { color: #aaa !important; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand navbar-dark mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="{% url 'concerts:home' %}">🎵 Concert Finder</a>
        {% if logged_in %}
        <div class="navbar-nav flex-row gap-3">
            <a class="nav-link" href="{% url 'concerts:favorite_artists' %}">Favorite Artists</a>
            <a class="nav-link" href="{% url 'concerts:followed_artists' %}">Followed Artists</a>
            <a class="nav-link" href="{% url 'concerts:on_tour' %}">On Tour</a>
            <a class="nav-link" href="{% url 'concerts:search' %}">Search by City</a>
            <a class="nav-link" href="{% url 'concerts:logout' %}">Log out</a>
        </div>
        {% endif %}
    </div>
</nav>
<div class="container pb-5">
    {% if messages %}
        {% for message in messages %}
            <div class="alert {% if message.tags == 'error' %}alert-danger{% else %}alert-info{% endif %}">{{ message }}</div>
        {% endfor %}
    {% endif %}
    {% block content %}{% endblock %}
</div>
</body>
</html>
